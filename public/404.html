<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Redirection...</title>
    <script>
      // Redirection SPA pour GitHub Pages (repo project pages: /volantsaintmartin/)
      // segmentCount = 1 car l'application est servie sous /volantsaintmartin/
      var segmentCount = 1;
      var locationData = window.location;

      var redirectUrl =
        locationData.protocol +
        '//' +
        locationData.hostname +
        (locationData.port ? ':' + locationData.port : '') +
        locationData.pathname.split('/').slice(0, 1 + segmentCount).join('/') +
        '/?/' +
        locationData.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (locationData.search ? '&' + locationData.search.slice(1).replace(/&/g, '~and~') : '') +
        locationData.hash;

      locationData.replace(redirectUrl);
    </script>
  </head>
  <body></body>
</html>
