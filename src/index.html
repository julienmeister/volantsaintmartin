<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Volant Saint Martin Badminton</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Restaure l'URL réelle après la redirection de 404.html sur GitHub Pages.
      (function (locationData) {
        if (locationData.search[1] === '/') {
          var decodedPath = locationData.search
            .slice(1)
            .split('&')
            .map(function (part) {
              return part.replace(/~and~/g, '&');
            })
            .join('?');

          window.history.replaceState(null, '', locationData.pathname.slice(0, -1) + decodedPath + locationData.hash);
        }
      })(window.location);
    </script>
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
